name: Pages — isolated drift evidence

# Manual evidence-only export. It cannot update canonical source or open a PR.

on:
  workflow_dispatch:

permissions:
  id-token: write       # required for azure/login OIDC
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.MPP_PAGES_APP_ID }}
          tenant-id: ${{ vars.MPP_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: pac auth (re-uses az token)
        env:
          ENV_URL: ${{ vars.MPP_DEV_ENV_URL }}
        run: |
          pac auth create --name nonprofit-website-dev \
            --environment "$ENV_URL" \
            --azureCliAuth

      - name: Download isolated Dev comparison
        run: pwsh ./scripts/pages-download.ps1 -Env dev -ComparisonPath .worktree/portal-comparison/dev

      - name: Upload comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: dev-portal-comparison
          path: .worktree/portal-comparison/dev
          retention-days: 7
